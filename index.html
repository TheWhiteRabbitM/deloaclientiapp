<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1C1B1F">
    <meta name="description" content="Monitora i prezzi orari dell'energia Deloa e risparmia sui consumi domestici">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Deloa Energy">
    <title>Deloa Energy - Prezzi Orari</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="top-app-bar">
        <div class="top-app-bar__content">
            <img src="deloa.png" alt="Deloa Energy" class="top-app-bar__logo">
        </div>
        <div class="top-app-bar__actions">
            <div class="lang-selector">
                <select id="lang-select" class="lang-select" aria-label="Language">
                    <option value="it">IT</option>
                    <option value="de">DE</option>
                    <option value="en">EN</option>
                </select>
            </div>
            <button class="icon-btn" id="btn-theme" aria-label="Cambia tema">
                <span class="material-icons-round" id="theme-icon">light_mode</span>
            </button>
            <button class="icon-btn" id="btn-refresh" aria-label="Aggiorna">
                <span class="material-icons-round">refresh</span>
            </button>
            <button class="icon-btn" id="btn-notifications" aria-label="Notifiche">
                <span class="material-icons-round" id="notif-icon">notifications_off</span>
            </button>
        </div>
    </header>

    <main class="main-content">

        <section class="card status-card" id="status-card">
            <div class="status-card__row">
                <span class="material-icons-round status-card__icon">bolt</span>
                <div class="status-card__info">
                    <p class="status-card__label">Prezzo attuale</p>
                    <p class="status-card__value" id="status-value">--</p>
                </div>
                <div class="status-card__range">
                    <div class="status-card__range-item">
                        <span class="status-card__range-label">min</span>
                        <span class="status-card__range-value status-card__range-value--min" id="min-today">--</span>
                    </div>
                    <div class="status-card__range-item">
                        <span class="status-card__range-label">max</span>
                        <span class="status-card__range-value status-card__range-value--max" id="max-today">--</span>
                    </div>
                </div>
            </div>
            <div class="status-card__footer">
                <div class="status-card__compare">
                    <span>ieri</span>
                    <span class="status-card__compare-value" id="compare-yesterday-val">--</span>
                </div>
                <div class="status-card__compare">
                    <span>oggi</span>
                    <span class="status-card__compare-value" id="compare-today-val">--</span>
                </div>
                <div class="status-card__diff" id="compare-diff"></div>
                <div class="status-card__times">
                    <span id="last-update">--</span>
                    <span id="next-update">--</span>
                </div>
            </div>
        </section>

        <section class="card chart-card">
            <h2 class="section-title">Andamento Prezzi Oggi</h2>
            <div class="chart-container" id="chart"></div>
            <div class="chart-legend">
                <div class="chart-legend__item">
                    <span class="chart-legend__dot chart-legend__dot--cheap"></span>
                    <span>Conviene</span>
                </div>
                <div class="chart-legend__item">
                    <span class="chart-legend__dot chart-legend__dot--medium"></span>
                    <span>Normale</span>
                </div>
                <div class="chart-legend__item">
                    <span class="chart-legend__dot chart-legend__dot--expensive"></span>
                    <span>Evita</span>
                </div>
            </div>
        </section>

        <section class="card table-card">
            <h2 class="section-title">Dettaglio Orario</h2>
            <div class="table-container" id="price-table"></div>
        </section>

        <section class="card smart-card">
            <h2 class="section-title smart-card__title">
                <span class="material-icons-round">psychology</span>
                Consumo intelligente
            </h2>
            <div class="smart-saving" id="smart-saving"></div>
        </section>

        <section class="card history-card">
            <h2 class="section-title">Storico Prezzi</h2>
            <div class="history-list" id="history-list"></div>
        </section>

    </main>

    <div class="snackbar" id="snackbar" role="status" aria-live="polite">
        <span class="snackbar__message" id="snackbar-message"></span>
        <button class="snackbar__action" id="snackbar-action">OK</button>
    </div>

    <script src="i18n.js"></script>
    <script src="app.js"></script>
</body>
</html>

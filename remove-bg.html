<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Sfondo Logo Deloa</title>
    <style>
        body { font-family: sans-serif; padding: 40px; text-align: center; background: #1C1B1F; color: #fff; }
        canvas { display: none; }
        .btn { padding: 14px 28px; font-size: 16px; cursor: pointer; background: #7B8D3C; color: white; border: none; border-radius: 12px; font-weight: 600; margin: 8px; }
        .btn:hover { background: #8FA34A; }
        .preview { margin-top: 20px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; align-items: flex-end; }
        .preview-box { text-align: center; }
        .preview-box span { display: block; font-size: 12px; margin-bottom: 8px; color: #999; }
        .preview-box img { border-radius: 8px; }
        .bg-dark { background: #1C1B1F; padding: 16px; border-radius: 12px; }
        .bg-light { background: #F6F2F7; padding: 16px; border-radius: 12px; }
    </style>
</head>
<body>
    <h1>Rimuovi Sfondo Bianco dal Logo Deloa</h1>
    <p>Genera una versione con sfondo trasparente</p>
    <button class="btn" onclick="removeBg()">Rimuovi Sfondo e Scarica</button>
    <button class="btn" onclick="generateIcons()" style="background:#5C6BC0;">Genera Icone PWA</button>
    <div class="preview" id="preview"></div>
    <canvas id="canvas"></canvas>
    <script>
        const logoImg = new Image();
        logoImg.src = 'deloa-logo.png';

        function removeBg() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const preview = document.getElementById('preview');
            preview.innerHTML = '';

            canvas.width = logoImg.width;
            canvas.height = logoImg.height;
            ctx.drawImage(logoImg, 0, 0);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const brightness = (r + g + b) / 3;

                if (brightness > 240) {
                    data[i + 3] = 0;
                } else if (brightness > 200) {
                    const alpha = ((brightness - 200) / 55) * 255;
                    data[i + 3] = Math.max(0, 255 - alpha);
                }
            }

            ctx.putImageData(imageData, 0, 0);

            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'deloa-logo-transparent.png';
                a.click();
                URL.revokeObjectURL(url);

                const box = document.createElement('div');
                box.className = 'preview-box';
                box.innerHTML = `<span>Originale</span><div class="bg-dark"><img src="deloa-logo.png" style="max-width:200px;"></div>`;
                preview.appendChild(box);

                const box2 = document.createElement('div');
                box2.className = 'preview-box';
                box2.innerHTML = `<span>Trasparente</span><div class="bg-dark"><img src="${url}" style="max-width:200px;"></div>`;
                preview.appendChild(box2);
            }, 'image/png');
        }

        function generateIcons() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const sizes = [192, 512];
            const preview = document.getElementById('preview');
            preview.innerHTML = '';

            sizes.forEach(size => {
                canvas.width = size;
                canvas.height = size;

                const radius = size * 0.22;
                ctx.fillStyle = '#1C1B1F';
                ctx.beginPath();
                ctx.roundRect(0, 0, size, size, radius);
                ctx.fill();

                const logoAspect = logoImg.width / logoImg.height;
                let drawW, drawH, drawX, drawY;
                const padding = size * 0.18;

                if (logoAspect > 1) {
                    drawW = size - padding * 2;
                    drawH = drawW / logoAspect;
                } else {
                    drawH = size - padding * 2;
                    drawW = drawH * logoAspect;
                }
                drawX = (size - drawW) / 2;
                drawY = (size - drawH) / 2;

                ctx.drawImage(logoImg, drawX, drawY, drawW, drawH);

                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `icon-${size}.png`;
                    a.click();
                    URL.revokeObjectURL(url);

                    const box = document.createElement('div');
                    box.className = 'preview-box';
                    box.innerHTML = `<span>icon-${size}.png</span><img src="${url}" style="width:${size > 200 ? 120 : 60}px;">`;
                    preview.appendChild(box);
                }, 'image/png');
            });
        }
    </script>
</body>
</html>
